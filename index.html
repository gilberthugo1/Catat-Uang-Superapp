<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CatatUang - Catatan Keuangan Mudah</title>

  <!-- Pengaturan PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icon-512.png" />

  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root { --scale: 1; }
    html { font-size: calc(16px * var(--scale)); scroll-behavior: smooth; }
    body { background-color: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 92px; }
    .large-mode { --scale: 1.18; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .btn-press:active { transform: scale(0.97); }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl relative">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-emerald-600 text-white px-4 py-3.5 flex items-center justify-between shadow-md">
    <div>
      <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2">
        <span>💰</span> CatatUang
      </h1>
      <p class="text-xs text-emerald-100">Mudah dicatat, tenang di hati</p>
    </div>
    <button onclick="toggleFontSize()" id="btnFont" class="bg-white/20 hover:bg-white/30 text-white font-bold text-sm px-3 py-2 rounded-xl border border-white/30 btn-press">
      Aa+ Perbesar
    </button>
  </header>

  <!-- ================= TAB 1: BERANDA ================= -->
  <main id="tab-beranda" class="p-4 space-y-5">
    <!-- Kartu Ringkasan Utama -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <p class="text-sm font-semibold text-slate-500">Total Seluruh Uang & Aset Saat Ini</p>
      <h2 id="homeTotalAset" class="text-3xl font-extrabold text-slate-900 mt-1">Rp 0</h2>

      <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-100">
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
          <p class="text-xs font-bold text-emerald-700">⬇️ Masuk Bulan Ini</p>
          <p id="homeMasuk" class="text-base font-extrabold text-emerald-800 mt-0.5">Rp 0</p>
        </div>
        <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
          <p class="text-xs font-bold text-rose-700">⬆️ Keluar Bulan Ini</p>
          <p id="homeKeluar" class="text-base font-extrabold text-rose-800 mt-0.5">Rp 0</p>
        </div>
      </div>

      <!-- Batas Belanja -->
      <div class="mt-4 pt-4 border-t border-slate-100">
        <div class="flex justify-between items-center text-sm mb-1.5">
          <span class="font-bold text-slate-700">Batas Belanja Bulan Ini</span>
          <button onclick="ubahBatasBelanja()" class="text-emerald-700 font-bold underline text-xs">Atur Batas</button>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-3.5 overflow-hidden">
          <div id="budgetBar" class="bg-emerald-600 h-3.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p id="budgetText" class="text-xs font-semibold text-slate-600 mt-1.5"></p>
      </div>
    </section>

    <!-- Tombol Besar Utama -->
    <section class="grid grid-cols-2 gap-3">
      <button onclick="openModal('masuk')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-4 px-3 rounded-2xl shadow-md font-extrabold text-lg flex flex-col items-center justify-center gap-1 btn-press">
        <span class="text-2xl">➕</span>
        <span>Uang Masuk</span>
      </button>
